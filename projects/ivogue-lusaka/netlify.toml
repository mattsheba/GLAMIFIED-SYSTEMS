# iVogue Lusaka — Netlify site configuration
# Deploy this folder as its own Netlify site:
#   Base directory:    projects/ivogue-lusaka
#   Build command:     npm run build
#   Publish directory: projects/ivogue-lusaka
#   Functions:         projects/ivogue-lusaka/netlify/functions

[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**", "assets/pricing.js", "assets/zm.js"]

# /api/* is the public face of the functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 301

[[redirects]]
  from = "/trade-in"
  to = "/trade-in.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pay.lenco.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com https://pay.lenco.co; connect-src 'self' https://api.lenco.co; form-action 'self'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/devices/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
